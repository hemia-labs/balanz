name: CFDI Phase 0 isolated validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfdi-phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-zero:
    name: Isolated Phase 0 full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Phase 0 against isolated real services
        shell: pwsh
        run: >-
          ./infra/cfdi-phase0/validate-phase0-local.ps1
          -ProjectName "cfdi-phase0-ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cfdi-phase0-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/cfdi-phase0-validation-reports/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
