name: Balanz release
run-name: Balanz release ${{ inputs.release_tag || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry the version committed on main: balanz-vMAJOR.MINOR.PATCH'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: balanz-release-main
  cancel-in-progress: false

jobs:
  classify:
    if: github.repository == 'hemia-labs/balanz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.classify.outputs.release }}
      tag: ${{ steps.classify.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify a version-only merge or validate a retry
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            node infra/deploy/release.mjs retry "$RELEASE_TAG"
          else
            node infra/deploy/release.mjs classify "$BASE_SHA"
          fi

  checks:
    needs: classify
    if: needs.classify.outputs.release != 'true'
    uses: ./.github/workflows/ci.yml

  version-pr:
    needs: [classify, checks]
    if: needs.classify.outputs.release != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate organization release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_CLIENT_ID" || { echo '::error::Organization variable RELEASE_APP_CLIENT_ID is required'; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo '::error::Organization secret RELEASE_APP_PRIVATE_KEY is required'; exit 1; }
      - name: Create the organization GitHub App token for version PR events
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: balanz
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the Changesets version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version: bun run version:balanz
          branch: main
          title: 'chore(balanz): release application version'
          commit: 'chore(balanz): release application version'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    needs: [classify, checks]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      release_tag: ${{ needs.classify.outputs.tag }}
    permissions:
      contents: write
    env:
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: '5432'
      CI_DB_USERNAME: postgres
      CI_DB_PASSWORD: baseline-ci-only
      CI_DB_DATABASE: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: baseline-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.2'
      - name: Validate the release commit and its container images
        run: bash infra/deploy/checks.sh
      - name: Publish private images, release manifest and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.classify.outputs.tag }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$REGISTRY_HOST" = registry.hemia.cloud
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          export DOCKER_CONFIG="$RUNNER_TEMP/balanz-registry-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USERNAME" --password-stdin
          node infra/deploy/release.mjs publish "$RELEASE_TAG"
          echo "Release $RELEASE_TAG published. The following job deploys the configured Docker target when enabled." >> "$GITHUB_STEP_SUMMARY"

  validate-deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/balanz-deploy.yml
    with:
      operation: deploy
      release_tag: ${{ needs.publish.outputs.release_tag }}
      target_mode: ${{ vars.BALANZ_DOCKER_TARGET || 'validation' }}
      automatic: true
    secrets: inherit
