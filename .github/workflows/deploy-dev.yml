name: deploy-balanz-dev

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: balanz-dev
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /srv/apps/balanz
  DEPLOY_USER: deploy
  NEXT_PUBLIC_API_URL: https://api-contable.hemia.dev/api/v1
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_DIR: /srv/apps/balanz/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  deploy:
    name: Deploy Balanz DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate frontend
        run: |
          bun run --cwd apps/web lint
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web test

      - name: Validate backend
        run: |
          bun run --cwd apps/api lint
          bun run --cwd apps/api test --runInBand

      - name: Build applications
        run: bun run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps-deploy ~/.ssh/known_hosts

      - name: Prepare release directory
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" "$DEPLOY_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          release_dir=$1
          deploy_root=$2
          case "$release_dir" in
            "$deploy_root"/releases/*) ;;
            *) echo "release path is outside the deployment root" >&2; exit 72 ;;
          esac
          test -d "$deploy_root/releases" "$deploy_root/shared"
          install -d -m 0700 -- "$release_dir"
          REMOTE

      - name: Upload release
        run: |
          rsync -az --safe-links \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='.test-dist/' \
            --exclude='coverage/' \
            -e "ssh -i $HOME/.ssh/vps-deploy" \
            ./ "$DEPLOY_USER@$VPS_HOST:$RELEASE_DIR/"

      - name: Upload runtime configuration
        env:
          API_ENV: ${{ secrets.BALANZ_API_ENV }}
          WORKER_ENV: ${{ secrets.BALANZ_WORKER_ENV }}
          MIGRATION_ENV: ${{ secrets.BALANZ_MIGRATION_ENV }}
        run: |
          test -n "$API_ENV"
          test -n "$WORKER_ENV"
          test -n "$MIGRATION_ENV"

          upload_secret() {
            value=$1
            profile=$2
            temporary="$DEPLOY_ROOT/shared/.$profile.env.$RELEASE_ID"
            target="$DEPLOY_ROOT/shared/$profile.env"
            printf '%s\n' "$value" | ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
              "set -Eeuo pipefail; umask 077; cat > '$temporary'; test -s '$temporary'; chmod 0600 -- '$temporary'; mv -f -- '$temporary' '$target'"
          }

          upload_secret "$API_ENV" api
          upload_secret "$WORKER_ENV" worker
          upload_secret "$MIGRATION_ENV" migration

      - name: Install and activate release
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" "$DEPLOY_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          release_dir=$1
          deploy_root=$2
          current_link="$deploy_root/current"
          next_link="$deploy_root/current.next"
          rollback_link="$deploy_root/current.rollback"
          migration_env="$deploy_root/shared/migration.env"
          previous_release=
          worker_paused=false
          activated=false

          source "$HOME/.nvm/nvm.sh"
          export PATH="$HOME/.bun/bin:$PATH"
          command -v bun >/dev/null
          command -v pm2 >/dev/null

          if [[ -L $current_link ]]; then
            previous_release=$(readlink -f -- "$current_link")
            [[ $previous_release == "$deploy_root"/releases/* && -d $previous_release ]]
          elif [[ -e $current_link ]]; then
            echo "current release path must be absent or a symbolic link" >&2
            exit 72
          fi

          probe() {
            curl --fail --silent --show-error \
              --retry 10 --retry-connrefused --retry-delay 2 \
              --connect-timeout 2 --max-time 5 "$1" >/dev/null
          }

          restore_previous() {
            if [[ -n $previous_release ]]; then
              ln -sfn -- "$previous_release" "$rollback_link"
              mv -Tf -- "$rollback_link" "$current_link"
              cd "$previous_release"
              pm2 delete balanz-worker-dev >/dev/null 2>&1 || true
              pm2 startOrReload ecosystem.config.cjs --update-env
              probe http://127.0.0.1:5181/
              probe http://127.0.0.1:3021/api/v1
              pm2 save
            else
              pm2 delete balanz-web-dev balanz-api-dev balanz-worker-dev >/dev/null 2>&1 || true
              pm2 save --force >/dev/null 2>&1 || true
              rm -f -- "$current_link"
            fi
          }

          finish() {
            status=$?
            trap - EXIT HUP INT TERM
            rm -f -- "$migration_env" "$next_link" "$rollback_link"
            if [[ $status -ne 0 && ( $worker_paused == true || $activated == true ) ]]; then
              echo "deployment failed; restoring the previous release" >&2
              restore_previous || status=75
            fi
            exit "$status"
          }
          trap finish EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          cd "$release_dir"
          bun install --frozen-lockfile --ignore-scripts

          if pm2 describe balanz-worker-dev >/dev/null 2>&1; then
            worker_paused=true
            pm2 stop balanz-worker-dev
            pm2 save
          fi

          test -s "$migration_env"
          cd "$release_dir/apps/api"
          bun --env-file="$migration_env" run release:prepare
          rm -f -- "$migration_env"

          ln -s -- "$release_dir" "$next_link"
          mv -Tf -- "$next_link" "$current_link"
          activated=true

          cd "$release_dir"
          pm2 startOrReload ecosystem.config.cjs --update-env
          probe http://127.0.0.1:5181/
          probe http://127.0.0.1:3021/liveness
          probe http://127.0.0.1:3021/readiness
          probe http://127.0.0.1:3002/liveness
          probe http://127.0.0.1:3002/readiness
          pm2 save

          worker_paused=false
          activated=false
          trap - EXIT HUP INT TERM
          REMOTE

      - name: Remove temporary credentials and SSH key
        if: always()
        run: |
          if [[ -f ~/.ssh/vps-deploy ]]; then
            ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
              "rm -f -- '$DEPLOY_ROOT/shared/migration.env' '$DEPLOY_ROOT/shared/.migration.env.$RELEASE_ID' '$DEPLOY_ROOT/shared/.api.env.$RELEASE_ID' '$DEPLOY_ROOT/shared/.worker.env.$RELEASE_ID'" || true
            rm -f -- ~/.ssh/vps-deploy
          fi
