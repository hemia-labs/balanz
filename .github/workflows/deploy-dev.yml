name: deploy-balanz-dev

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: balanz-dev
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /srv/apps/balanz
  DEPLOY_USER: deploy
  NEXT_PUBLIC_API_URL: https://api-contable.hemia.dev/api/v1
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_DIR: /srv/apps/balanz/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  deploy:
    name: Deploy Balanz DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev

    # Applies only to runner processes, not the remote runtime environment.
    env:
      SECRETS_ENABLED: 'false'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: baseline-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate frontend
        run: |
          bun run --cwd apps/web lint
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web test

      - name: Validate backend
        run: |
          node --test infra/deploy/deploy-release.test.cjs infra/deploy/retain-releases.test.cjs
          bun run --cwd apps/api lint
          bun run --cwd apps/api test --runInBand

      - name: Build applications
        run: bun run build

      - name: Validate incremental database migrations
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: baseline-ci-only
          DB_DATABASE: postgres
          PGPASSWORD: baseline-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
          bun run --cwd apps/api qa:migrations
          bun run --cwd apps/api migration:run
          bun run --cwd apps/api qa:migrations

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps-deploy ~/.ssh/known_hosts

      - name: Prepare release directory
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" "$DEPLOY_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          release_dir=$1
          deploy_root=$2
          case "$release_dir" in
            "$deploy_root"/releases/*) ;;
            *) echo "release path is outside the deployment root" >&2; exit 72 ;;
          esac
          test -d "$deploy_root/releases"
          test -d "$deploy_root/shared"
          install -d -m 0700 -- "$release_dir"
          config_dir="$deploy_root/runtime-config/${release_dir##*/}"
          # A release configuration is immutable once created.
          install -d -m 0700 -- "$deploy_root/runtime-config"
          mkdir -m 0700 -- "$config_dir"
          install -d -m 0700 -- "$config_dir/api" "$config_dir/worker"
          REMOTE

      - name: Upload release
        run: |
          rsync -az --safe-links \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='.test-dist/' \
            --exclude='coverage/' \
            -e "ssh -i $HOME/.ssh/vps-deploy" \
            ./ "$DEPLOY_USER@$VPS_HOST:$RELEASE_DIR/"

      - name: Upload runtime configuration
        env:
          API_ENV: ${{ secrets.BALANZ_API_ENV }}
          WORKER_ENV: ${{ secrets.BALANZ_WORKER_ENV }}
          MIGRATION_ENV: ${{ secrets.BALANZ_MIGRATION_ENV }}
        run: |
          test -n "$API_ENV"
          test -n "$WORKER_ENV"
          test -n "$MIGRATION_ENV"

          upload_secret() {
            value=$1
            profile=$2
            config_dir="$DEPLOY_ROOT/runtime-config/$RELEASE_ID"
            target="$config_dir/$profile/runtime.env"
            if [[ $profile == migration ]]; then
              target="$config_dir/migration.env"
            fi
            temporary="$target.tmp"
            printf '%s\n' "$value" | ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
              "set -Eeuo pipefail; umask 077; cat > '$temporary'; test -s '$temporary'; chmod 0600 -- '$temporary'; mv -f -- '$temporary' '$target'"
          }

          upload_secret "$API_ENV" api
          upload_secret "$WORKER_ENV" worker
          upload_secret "$MIGRATION_ENV" migration

      - name: Install and activate release
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" "$DEPLOY_ROOT" <<'REMOTE'
          set -Eeuo pipefail
          release_dir=$1
          deploy_root=$2
          current_link="$deploy_root/current"
          next_link="$deploy_root/current.next"
          rollback_link="$deploy_root/current.rollback"
          config_dir="$deploy_root/runtime-config/${release_dir##*/}"
          migration_env="$config_dir/migration.env"
          previous_release=
          worker_paused=false
          activated=false

          source "$HOME/.nvm/nvm.sh"
          export PATH="$HOME/.bun/bin:$PATH"
          command -v bun >/dev/null
          command -v pm2 >/dev/null

          if [[ -L $current_link ]]; then
            previous_release=$(readlink -f -- "$current_link")
            [[ $previous_release == "$deploy_root"/releases/* && -d $previous_release ]]
          elif [[ -e $current_link ]]; then
            echo "current release path must be absent or a symbolic link" >&2
            exit 72
          fi

          probe() {
            local status
            echo "Checking $1"
            if curl --fail --silent --show-error \
              --retry 10 --retry-connrefused --retry-delay 2 \
              --connect-timeout 2 --max-time 5 "$1" >/dev/null; then
              return 0
            else
              status=$?
            fi
            echo "Health check failed: $1 (curl exit $status)" >&2
            case "$1" in
              */readiness|*/liveness)
                # Take a fresh bounded snapshot before restoring the old release.
                # Do not print response bodies, credentials or application logs.
                curl --silent --show-error --connect-timeout 2 --max-time 5 \
                  --max-filesize 65536 "$1" | node -e '
                  const fs = require("node:fs");
                  try {
                    const body = JSON.parse(fs.readFileSync(0, "utf8"));
                    const safe = value => {
                      const out = {};
                      if (["up", "down", "degraded", "disabled", "bypassed"].includes(value?.status)) out.status = value.status;
                      if (typeof value?.required === "boolean") out.required = value.required;
                      if (typeof value?.errorCode === "string" && /^[A-Z][A-Z0-9_]{0,99}$/.test(value.errorCode)) out.errorCode = value.errorCode;
                      if (Array.isArray(value?.diagnostics)) out.diagnostics = value.diagnostics.slice(0, 2).map(d => {
                        const detail = {};
                        if (["HeadBucket", "PutObject", "HeadObject", "GetObject", "DeleteObject", "ValidateMetadata", "ValidateContent"].includes(d?.operation)) detail.operation = d.operation;
                        if (typeof d?.code === "string" && /^[A-Za-z][A-Za-z0-9_]{0,79}$/.test(d.code)) detail.code = d.code;
                        if (Number.isInteger(d?.httpStatusCode) && d.httpStatusCode >= 100 && d.httpStatusCode <= 599) detail.httpStatusCode = d.httpStatusCode;
                        return detail;
                      });
                      return out;
                    };
                    const result = safe(body);
                    if (["api", "worker"].includes(body?.process)) result.process = body.process;
                    result.dependencies = {};
                    for (const name of ["postgres", "storage", "scanner", "redisWakeup", "workerSupervisor"]) {
                      const value = body?.dependencies?.[name] ?? (name === "workerSupervisor" ? body?.workerSupervisor : undefined);
                      if (value) result.dependencies[name] = safe(value);
                    }
                    console.error("Health diagnostic snapshot: " + JSON.stringify(result));
                  } catch {
                    console.error("Health diagnostic unavailable: empty or invalid JSON response");
                  }
                ' || echo "Health diagnostic request failed" >&2
                ;;
            esac
            return "$status"
          }

          remove_balanz_processes() {
            local names name
            names=$(pm2 jlist | node -e '
              const fs = require("node:fs");
              const allowed = ["balanz-web-dev", "balanz-api-dev", "balanz-worker-dev"];
              for (const p of JSON.parse(fs.readFileSync(0, "utf8"))) {
                if (allowed.includes(p.name)) console.log(p.name);
              }
            ') || return
            while IFS= read -r name; do
              [[ -z $name ]] || pm2 delete "$name" >/dev/null || return
            done <<< "$names"
          }

          start_release() {
            cd "$1" || return
            remove_balanz_processes || return
            pm2 start "$1/ecosystem.config.cjs" --only balanz-web-dev,balanz-api-dev,balanz-worker-dev || return
            pm2 jlist | node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const root = process.argv[1];
              const names = ["balanz-web-dev", "balanz-api-dev", "balanz-worker-dev"];
              const expected = require(path.join(root, "ecosystem.config.cjs")).apps.filter(a => names.includes(a.name));
              const actual = JSON.parse(fs.readFileSync(0, "utf8"));
              const args = value => Array.isArray(value) ? value : value ? value.split(/\s+/) : [];
              for (const name of names) {
                const app = expected.find(a => a.name === name);
                const matches = actual.filter(p => p.name === name);
                if (!app && matches.length === 0) continue;
                const state = matches[0]?.pm2_env;
                if (!app || matches.length !== 1 || !state ||
                    state.pm_cwd !== path.resolve(root, app.cwd || ".") ||
                    state.pm_exec_path !== path.resolve(root, app.cwd || ".", app.script) ||
                    JSON.stringify(args(state.node_args)) !== JSON.stringify(args(app.node_args))) {
                  console.error("PM2 release definition mismatch: " + name);
                  process.exit(1);
                }
              }
            ' "$1" || return
          }

          restore_previous() {
            if [[ -n $previous_release ]]; then
              ln -sfn -- "$previous_release" "$rollback_link" || return
              mv -Tf -- "$rollback_link" "$current_link" || return
              start_release "$previous_release" || return
              probe http://127.0.0.1:5181/ || return
              local has_worker
              has_worker=$(node -e 'console.log(require(process.argv[1]).apps.some(a => a.name === "balanz-worker-dev"))' "$previous_release/ecosystem.config.cjs") || return
              if [[ $has_worker == false ]]; then
                # Legacy releases predate the fiscal worker and health endpoints.
                probe http://127.0.0.1:3021/api/v1 || return
                pm2 save || return
                return 0
              fi
              probe http://127.0.0.1:3021/liveness || return
              probe http://127.0.0.1:3021/readiness || return
              probe http://127.0.0.1:3002/liveness || return
              probe http://127.0.0.1:3002/readiness || return
              pm2 save
            else
              remove_balanz_processes || return
              pm2 save --force >/dev/null || return
              rm -f -- "$current_link"
            fi
          }

          finish() {
            status=$?
            trap - EXIT HUP INT TERM
            rm -f -- "$migration_env" "$next_link" "$rollback_link"
            if [[ $status -ne 0 && ( $worker_paused == true || $activated == true ) ]]; then
              echo "deployment failed; restoring the previous release" >&2
              restore_previous || status=75
            fi
            exit "$status"
          }
          trap finish EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          cd "$release_dir"
          test -s "$config_dir/api/runtime.env"
          test -s "$config_dir/worker/runtime.env"
          test -s "$migration_env"
          bun install --frozen-lockfile --ignore-scripts

          if pm2 describe balanz-worker-dev >/dev/null 2>&1; then
            worker_paused=true
            pm2 stop balanz-worker-dev
            pm2 save
          fi

          test -s "$migration_env"
          cd "$release_dir/apps/api"
          bun --env-file="$migration_env" run release:prepare
          rm -f -- "$migration_env"

          ln -s -- "$release_dir" "$next_link"
          mv -Tf -- "$next_link" "$current_link"
          activated=true

          cd "$release_dir"
          start_release "$release_dir"
          probe http://127.0.0.1:5181/
          probe http://127.0.0.1:3021/liveness
          probe http://127.0.0.1:3021/readiness
          probe http://127.0.0.1:3002/liveness
          probe http://127.0.0.1:3002/readiness
          pm2 save

          worker_paused=false
          activated=false
          trap - EXIT HUP INT TERM
          # Retention failure must not roll back an already healthy deployment.
          node "$release_dir/infra/deploy/retain-releases.cjs" "$deploy_root" "$previous_release"
          REMOTE

      - name: Remove temporary credentials and SSH key
        if: always()
        run: |
          if [[ -f ~/.ssh/vps-deploy ]]; then
            ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
              "rm -f -- '$DEPLOY_ROOT/runtime-config/$RELEASE_ID/migration.env' '$DEPLOY_ROOT/runtime-config/$RELEASE_ID/migration.env.tmp' '$DEPLOY_ROOT/runtime-config/$RELEASE_ID/api/runtime.env.tmp' '$DEPLOY_ROOT/runtime-config/$RELEASE_ID/worker/runtime.env.tmp'" || true
            rm -f -- ~/.ssh/vps-deploy
          fi
