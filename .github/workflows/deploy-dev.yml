name: deploy-balanz-dev

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: balanz-dev
  cancel-in-progress: false

env:
  DEPLOY_ROOT: /srv/apps/balanz
  DEPLOY_USER: balanz-deploy
  NEXT_PUBLIC_API_URL: https://api-contable.hemia.dev/api/v1
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_DIR: /srv/apps/balanz/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  VPS_HOST: ${{ vars.VPS_HOST }}

jobs:
  deploy:
    name: Deploy Balanz DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: balanz_test
          POSTGRES_PASSWORD: balanz_test
          POSTGRES_DB: balanz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balanz_test -d balanz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_CORS_ORIGINS: http://localhost:5181
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: balanz_test
      DB_PASSWORD: balanz_test
      DB_DATABASE: balanz_test
      DB_LOGGING: false
      JWT_SECRET: balanz-ci-access-secret
      JWT_REFRESH_SECRET: balanz-ci-refresh-secret
      REDIS_ENABLED: false
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: lax

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate frontend
        run: |
          bun run --cwd apps/web lint
          bun run --cwd apps/web typecheck
          bun run --cwd apps/web test

      - name: Validate backend
        run: |
          bun run --cwd apps/api test --runInBand
          bun run --cwd apps/api migration:run
          bun run --cwd apps/api seed:run
          bun run --cwd apps/api test:e2e --runInBand --silent test/invitations-memberships.e2e-spec.ts

      - name: Build applications
        run: bun run build

      - name: Validate release and rollback controls
        run: |
          node scripts/deploy/validate-ecosystem.cjs \
            ecosystem.config.cjs \
            "$GITHUB_WORKSPACE/apps/api" \
            current
          smoke_image="balanz/deploy-smoke:phase0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_run_key="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_image_owned=false
          smoke_image_id=
          cleanup_smoke_image() {
            original_status=$?
            trap - EXIT
            if [[ "$smoke_image_owned" == true ]] && \
              docker image inspect "$smoke_image" >/dev/null 2>&1; then
              actual_owner=$(docker image inspect \
                --format '{{ index .Config.Labels "com.balanz.validation.run" }}' \
                "$smoke_image")
              actual_id=$(docker image inspect --format '{{.Id}}' "$smoke_image")
              if [[ "$actual_owner" != "$smoke_run_key" ]] || \
                [[ -z "$smoke_image_id" ]] || \
                [[ "$actual_id" != "$smoke_image_id" ]]; then
                echo 'Refusing to remove a deployment smoke image owned by another run' >&2
                original_status=1
              elif ! docker image rm "$smoke_image" >/dev/null; then
                echo 'Deployment smoke image cleanup failed' >&2
                original_status=1
              elif docker image inspect "$smoke_image" >/dev/null 2>&1 || \
                docker image inspect "$smoke_image_id" >/dev/null 2>&1; then
                echo 'Deployment smoke image remained after cleanup' >&2
                original_status=1
              fi
            fi
            exit "$original_status"
          }
          trap cleanup_smoke_image EXIT
          if docker image inspect "$smoke_image" >/dev/null 2>&1; then
            echo 'Deployment smoke image tag already exists' >&2
            exit 73
          fi
          smoke_image_owned=true
          docker build \
            --tag "$smoke_image" \
            --label "com.balanz.validation.run=$smoke_run_key" \
            --file infra/cfdi-phase0/deploy-smoke/Dockerfile \
            infra/cfdi-phase0/deploy-smoke
          smoke_image_id=$(docker image inspect --format '{{.Id}}' "$smoke_image")
          [[ "$smoke_image_id" == sha256:* ]]
          [[ "$(docker image inspect \
            --format '{{ index .Config.Labels "com.balanz.validation.run" }}' \
            "$smoke_image")" == "$smoke_run_key" ]]
          docker run --rm \
            --network none \
            --user 0:0 \
            --env BALANZ_DISPOSABLE_CONTAINER=phase0-runtime-isolation-v1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            "$smoke_image" \
            bash scripts/deploy/smoke-runtime-isolation.sh
          docker run --rm \
            --network none \
            --user 0:0 \
            --env BALANZ_DISPOSABLE_CONTAINER=phase0-runtime-isolation-v1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            "$smoke_image" \
            bash scripts/deploy/smoke-rollback.sh
          docker run --rm \
            --network none \
            --user 0:0 \
            --env BALANZ_DISPOSABLE_CONTAINER=phase0-runtime-isolation-v1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            "$smoke_image" \
            bash scripts/deploy/smoke-legacy-cutover.sh

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps-deploy ~/.ssh/known_hosts

      - name: Prepare release directory
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" "$DEPLOY_ROOT" <<'REMOTE'
          set -euo pipefail
          release_dir=$1
          deploy_root=$2
          case "$release_dir" in
            "$deploy_root"/releases/*) ;;
            *) echo "release path is outside the deployment root" >&2; exit 72 ;;
          esac
          install -d -m 0700 -- "$deploy_root/releases" "$release_dir" "$release_dir/apps" "$release_dir/apps/api"
          REMOTE

      - name: Upload release
        run: |
          rsync -az --safe-links \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='.test-dist/' \
            --exclude='coverage/' \
            -e "ssh -i $HOME/.ssh/vps-deploy" \
            ./ "$DEPLOY_USER@$VPS_HOST:$RELEASE_DIR/"

      - name: Reject unsafe release links before dependency installation
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/prepare-runtime-isolation.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Install release dependencies without lifecycle scripts
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" bash -s -- "$RELEASE_DIR" <<'REMOTE'
          set -euo pipefail
          release_dir=$1
          test -x /usr/local/bin/bun && test ! -L /usr/local/bin/bun || {
            echo "System Bun 1.3.2 must be installed on the VPS" >&2
            exit 1
          }
          test "$(/usr/local/bin/bun --version)" = "1.3.2" || {
            echo "The VPS must use system Bun 1.3.2" >&2
            exit 1
          }
          if find -P "$release_dir/apps/api" -mindepth 1 -maxdepth 1 -name '.env*' \
            -print -quit | grep -q .; then
            echo "release contains an environment file before dependency installation" >&2
            exit 74
          fi
          cd "$release_dir"
          /usr/local/bin/bun install --frozen-lockfile --ignore-scripts
          chmod 0700 -- "$release_dir" "$release_dir/apps" "$release_dir/apps/api"
          REMOTE

      - name: Revalidate release links and runtime isolation after installation
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/prepare-runtime-isolation.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Validate release topology before forward migrations
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/preflight-release-topology.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Quiesce the audited legacy runtime before staging credentials
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/quiesce-legacy-release.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Stage least-privilege runtime configuration
        env:
          API_ENV: ${{ secrets.BALANZ_API_ENV }}
          WORKER_ENV: ${{ secrets.BALANZ_WORKER_ENV }}
        run: |
          test -n "$API_ENV"
          test -n "$WORKER_ENV"
          printf '%s\n' "$API_ENV" | ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/write-secret-file.sh' '$RELEASE_DIR' '$DEPLOY_ROOT' api"
          printf '%s\n' "$WORKER_ENV" | ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/write-secret-file.sh' '$RELEASE_DIR' '$DEPLOY_ROOT' worker"

      - name: Pause the managed worker before forward migrations
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/pause-managed-worker.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Run migrations with ephemeral credentials
        env:
          MIGRATION_ENV: ${{ secrets.BALANZ_MIGRATION_ENV }}
        run: |
          test -n "$MIGRATION_ENV"
          migration_status=0
          printf '%s\n' "$MIGRATION_ENV" | ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/run-release-migrations.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'" || migration_status=$?

          cleanup_status=0
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/cleanup-release-migration-credentials.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'" || cleanup_status=$?
          if (( cleanup_status != 0 )); then
            echo "Migration credential cleanup could not be verified" >&2
            exit "$cleanup_status"
          fi
          if (( migration_status != 0 )); then
            exit "$migration_status"
          fi

      - name: Prove previous API compatibility with the forward schema
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/verify-rollback-api-compatibility.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Activate release with automatic rollback
        run: |
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "bash '$RELEASE_DIR/scripts/deploy/activate-release.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'"

      - name: Verify remote migration credential cleanup
        if: always()
        run: |
          if [[ ! -f ~/.ssh/vps-deploy ]]; then
            exit 0
          fi
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "if [ -d '$DEPLOY_ROOT/runtime-config/$RELEASE_ID/migrator' ]; then bash '$RELEASE_DIR/scripts/deploy/cleanup-release-migration-credentials.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'; fi"

      - name: Remove runtime credentials from an inactive release
        if: always()
        run: |
          if [[ ! -f ~/.ssh/vps-deploy ]]; then
            exit 0
          fi
          ssh -i ~/.ssh/vps-deploy "$DEPLOY_USER@$VPS_HOST" \
            "if [ -f '$RELEASE_DIR/scripts/deploy/cleanup-inactive-release-runtime-credentials.sh' ] && [ -d '$DEPLOY_ROOT/runtime-config/$RELEASE_ID' ]; then bash '$RELEASE_DIR/scripts/deploy/cleanup-inactive-release-runtime-credentials.sh' '$RELEASE_DIR' '$DEPLOY_ROOT'; fi"

      - name: Remove deploy key
        if: always()
        run: rm -f -- ~/.ssh/vps-deploy
